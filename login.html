<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in to SkillStamp demo." />
  <title>Log in | SkillStamp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="login">
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">★</span> SkillStamp
    </a>
    <a class="back-link" href="index.html">← Home</a>
  </header>

  <main class="auth-wrap">
    <section class="auth-card">
      <div class="auth-logo">
        <span class="brand-mark" aria-hidden="true">★</span>
      </div>
      <span class="eyebrow">WELCOME BACK</span>
      <h1>Log in to SkillStamp</h1>
      <p class="muted">Continue building your skills and opportunities.</p>

      <form id="loginForm">
        <label for="loginEmail">Email address</label>
        <input id="loginEmail" type="email" placeholder="you@example.com" required />

        <label for="loginPassword">Password</label>
        <input
          id="loginPassword"
          type="password"
          placeholder="Enter any password for this demo"
          required
        />

        <button class="btn full" type="submit">Log in</button>
      </form>

      <p class="form-note">Demo mode: this form does not authenticate with Firebase yet.</p>
      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
