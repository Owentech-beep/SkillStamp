<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Edit your SkillStamp profile." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#07865b" />
  <title>Profile | SkillStamp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="profile">
  <header class="appbar">
    <a class="brand" href="dashboard.html">
      <span class="brand-mark" aria-hidden="true">★</span> SkillStamp
    </a>
    <a class="back-link" href="dashboard.html">← Dashboard</a>
  </header>

  <div class="app-layout">
    <aside class="sidebar">
      <a class="side-link" href="dashboard.html">⌂ <span>Home</span></a>
      <a class="side-link" href="challenges.html">▣ <span>Challenges</span></a>
      <a class="side-link" href="portfolio.html">★ <span>My SkillStamps</span></a>
      <a class="side-link" href="opportunities.html">↗ <span>Opportunities</span></a>
      <a class="side-link active" href="profile.html">○ <span>Profile</span></a>
    </aside>

    <main class="dashboard-main narrow-main">
      <div class="page-heading">
        <span class="eyebrow">YOUR ACCOUNT</span>
        <h1>My profile</h1>
        <p class="muted">
          Tell employers a little about yourself and your skills.
        </p>
      </div>

      <section class="card profile-card">
        <div class="profile-avatar" id="profileAvatar" aria-hidden="true">T</div>
        <h2 id="profileHeading">Your profile</h2>
        <p class="muted">SkillStamp member</p>

        <form id="profileForm">
          <label for="profileName">Full name</label>
          <input id="profileName" required />

          <label for="profileEmail">Email address</label>
          <input id="profileEmail" type="email" required />

          <label for="profileLocation">Location</label>
          <input id="profileLocation" placeholder="e.g. Polokwane, Limpopo" />

          <label for="profileSkills">Skills (separate with commas)</label>
          <input id="profileSkills" placeholder="HTML, communication, Excel" />

          <label for="profileAbout">About me</label>
          <textarea
            id="profileAbout"
            rows="4"
            placeholder="What are you learning or hoping to do?"
          ></textarea>

          <button class="btn full" type="submit">Save profile</button>
        </form>

        <button class="btn btn-danger full logout-button" onclick="logoutDemo()">
          Log out of demo
        </button>
        <button class="btn btn-ghost full reset-button" onclick="resetDemo()">
          Reset all demo data
        </button>
      </section>
    </main>
  </div>

  <nav class="mobile-nav">
    <a href="dashboard.html"><span aria-hidden="true">⌂</span><small>Home</small></a>
    <a href="challenges.html"><span aria-hidden="true">▣</span><small>Challenges</small></a>
    <a href="portfolio.html"><span aria-hidden="true">★</span><small>Stamps</small></a>
    <a href="opportunities.html"><span aria-hidden="true">↗</span><small>Jobs</small></a>
    <a class="active" href="profile.html"><span aria-hidden="true">○</span><small>Profile</small></a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
